name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean Version Manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib oleans and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.elan
            ~/.elan/toolchains
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain') }}-lake-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain') }}-lake-
            ${{ runner.os }}-lean-

      - name: Mathlib Dependency Cache Retrieval
        run: |
          echo "::group::Checking and retrieving Mathlib build cache..."
          if lake exe cache >/dev/null 2>&1; then
            echo "Mathlib cache configuration detected. Fetching pre-compiled oleans..."
            lake exe cache get
          else
            echo "No pre-compiled Mathlib cache executable found. Continuing clean build..."
          fi
          echo "::endgroup::"

      - name: Synchronize package configuration dependencies
        run: |
          echo "::group::Synchronizing package configuration dependencies..."
          lake setup
          echo "::endgroup::"

      - name: Build validation verification
        run: |
          echo "::group::Running package verification build..."
          lake build
          echo "::endgroup::"
